<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b19" media="(prefers-color-scheme: dark)">
<title>TTFL Radar</title>
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--text:#1d1d1b;--muted:#6b6a65;--faint:#9b9a94;--line:#e4e2db;
  --g-bg:#e3f1d6;--g-tx:#2f5d0c;--r-bg:#f9e1e0;--r-tx:#8f2523;--n-bg:#efede7;--n-tx:#6b6a65;
  --w-bg:#fbefd6;--w-tx:#7a4a06;--accent:#1f5fa8;--accent-bg:#e4eefa;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1b19;--card:#242422;--text:#ecebe6;--muted:#a3a29c;--faint:#77766f;--line:#363632;
  --g-bg:#24361a;--g-tx:#a6d47c;--r-bg:#3d2121;--r-tx:#f0a3a1;--n-bg:#2e2e2b;--n-tx:#a3a29c;
  --w-bg:#3a2e17;--w-tx:#f0c674;--accent:#8ab8ec;--accent-bg:#1f2d3d;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:19px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:transparent}
input[type=search]{width:100%;font:inherit;font-size:15px;padding:8px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row,.hd{display:grid;grid-template-columns:minmax(0,1fr) 38px repeat(3,31px) 40px 14px;gap:3px;align-items:center;
  padding:8px 10px}
.hd{font-size:11px;color:var(--faint);border-bottom:1px solid var(--line);padding-top:7px;padding-bottom:7px}
.hd button{all:unset;cursor:pointer;text-align:center}
.hd button[aria-sort]{color:var(--accent);font-weight:600}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj{font-weight:700;font-size:16px;text-align:right;line-height:1.1}
.av{font-weight:400;font-size:10px;color:var(--faint);white-space:nowrap}
.pl-c{font-size:11.5px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.pl-c.star{color:var(--accent);font-weight:700;font-size:15px}
.verdict{margin:10px 0 2px;padding:8px 10px;border-radius:10px;background:var(--accent-bg);color:var(--accent);font-size:13.5px}
.fyi{margin-top:8px;color:var(--muted);font-size:12.5px;line-height:1.6}
.c{height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11.5px;
  font-variant-numeric:tabular-nums}
.g{background:var(--g-bg);color:var(--g-tx)}.r{background:var(--r-bg);color:var(--r-tx)}
.n{background:var(--n-bg);color:var(--n-tx)}.x{color:var(--faint)}
.c.sm{opacity:.45;font-style:italic}
.st{font-size:12px;text-align:center}
.st.q{color:var(--w-tx)}.st.o{color:var(--r-tx)}.st.l{color:var(--faint)}
.row.dim .nm,.row.dim .pj{color:var(--faint)}
.det{display:none;padding:4px 12px 14px;border-bottom:1px solid var(--line);background:var(--bg);font-size:13.5px}
.det.open{display:block}
.det .mt{white-space:normal;overflow:visible}
.det h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin:12px 0 4px;font-weight:600}
.ln{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:none}
.ln.small b,.ln.small .mt{opacity:.5}
.ln b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0}
.tw{background:var(--w-bg);color:var(--w-tx)}.tr{background:var(--r-bg);color:var(--r-tx)}.tn{background:var(--n-bg);color:var(--n-tx)}
.legend{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.pos{color:var(--g-tx)}.neg{color:var(--r-tx)}
.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
a.more{display:inline-block;margin-top:12px;color:var(--accent);font-size:13.5px;text-decoration:none}
.intro{white-space:normal!important;margin:0 0 12px;line-height:1.5}
.split{display:grid;gap:14px}
.pick input[type=search]{margin-bottom:8px}
.plist{background:var(--card);border:1px solid var(--line);border-radius:14px;max-height:300px;overflow:auto}
.pl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.pl:last-child{border-bottom:none}
.pl.on{background:var(--accent-bg)}
.pl .mt{white-space:nowrap}
.tv2{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.spark{flex:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px 16px;min-width:0}
.sheet h2{font-size:18px;margin:12px 0 0}
.sheet h3,.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin:18px 0 6px;font-weight:600}
.sheet .mt,.card .mt{white-space:normal}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--bg);border-radius:10px;padding:8px 10px}
.tv{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .avgline{stroke:var(--faint);stroke-width:1.2;stroke-dasharray:4 4}
.chart .ax{fill:var(--faint);font-size:11px}
.chart .roll{fill:none;stroke:var(--accent);stroke-width:2.2;opacity:.85}
.chart .dot{fill:var(--n-tx);stroke:var(--card);stroke-width:1.5}
.chart .dot.lo{fill:var(--r-tx)}.chart .dot.hi{fill:var(--g-tx)}
.chart .dot.b2b{fill:var(--card);stroke:var(--n-tx);stroke-width:2}
.chart .flag{fill:var(--w-tx);font-size:12px;font-weight:700}
.chart .bar{fill:var(--n-bg)}.chart .bar.lo{fill:var(--r-bg)}.chart .bar.hi{fill:var(--g-bg)}
.chart .tline{fill:none;stroke-width:2.2}.chart .tdot{stroke:var(--card);stroke-width:1.5}
.chart .tline.G,.k.tG{stroke:#3d7cc9;background:#3d7cc9}.chart .tdot.G{fill:#3d7cc9}
.chart .tline.F,.k.tF{stroke:#c98a2b;background:#c98a2b}.chart .tdot.F{fill:#c98a2b}
.chart .tline.C,.k.tC{stroke:#8a5ccf;background:#8a5ccf}.chart .tdot.C{fill:#8a5ccf}
.leg{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.8}
.leg .k{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px;vertical-align:-1px}
.leg .k:first-child{margin-left:0}
.k.dotk{background:var(--n-tx)}.k.rollk{background:var(--accent);height:3px;border-radius:2px;width:14px;vertical-align:2px}
.k.avgk{border-top:2px dashed var(--faint);height:0;border-radius:0;width:14px;vertical-align:3px}
.dbars{display:grid;gap:6px}
.dbar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(80px,1fr) 46px;gap:10px;align-items:center;font-size:13.5px}
.dbar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .track{position:relative;height:10px;background:var(--bg);border-radius:5px}
.dbar .fill{position:absolute;top:0;height:10px;border-radius:5px}
.dbar .fill.g{background:var(--g-tx)}.dbar .fill.r{background:var(--r-tx)}
.dbar .zero{position:absolute;left:50%;top:-3px;width:1px;height:16px;background:var(--faint)}
.dbar b{text-align:right;font-variant-numeric:tabular-nums}
.dbar.small{opacity:.5}
.tl{display:flex;flex-wrap:wrap;gap:3px}
.tli{width:14px;height:14px;border-radius:3px}
.tli.p,.k.tlp{background:var(--g-tx)}.tli.q,.k.tlq{background:var(--w-tx)}.tli.o,.k.tlo{background:var(--r-tx)}
.k.tlp,.k.tlq,.k.tlo{border-radius:3px}
table.heat{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13.5px}
.heat th{font-size:11.5px;color:var(--faint);font-weight:600;text-align:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.heat th:first-child,.heat td:first-child{text-align:left;padding-left:12px}
.heat td{text-align:center;padding:4px 6px;border-bottom:1px solid var(--line)}
.heat td a{color:var(--text);text-decoration:none;font-weight:600}
.heat tr{cursor:pointer}.heat tr.on{background:var(--accent-bg)}
.heat .c{width:56px;margin:0 auto}
.cards{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 0 6px}
.card h3,.card>.mt{padding:0 14px}
.card .pl:last-child{border-bottom:none}
.chartwrap{position:relative}
.chart .cursor{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.chart .dot.cur{stroke:var(--text);stroke-width:2}
.chart .dot.off{opacity:.18}.chart .dot.on{stroke:var(--accent);stroke-width:2.5}
.chart .roll.dim{opacity:.25}
.chart .hlline{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 3}
.chart .hlt{fill:var(--accent);font-weight:600}
.chart .hit{fill:transparent;cursor:pointer}.chart .hit:hover{fill:var(--bg)}
.chart .tdot.few{opacity:.6}
svg.chart{touch-action:pan-y}
.tip{position:absolute;transform:translate(-50%,-100%);background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.45;pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:2}
#ttip{transform:translate(-50%,0)}
.tip .big{font-size:15px;font-weight:700}
.tip .k{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.chip.sm{font-size:12px;padding:3px 10px}
.chip.on{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.hint{margin:-2px 0 6px}
.dbar.clk{cursor:pointer;border-radius:6px}.dbar.clk:hover{background:var(--bg)}
.legb{all:unset;cursor:pointer;margin-right:6px}.legb.off{opacity:.35;text-decoration:line-through}
.planlist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pn{display:grid;grid-template-columns:110px minmax(0,1fr);gap:2px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pn:last-child{border-bottom:none}.pn.on{background:var(--accent-bg)}
.pd{display:flex;flex-direction:column;grid-row:span 2}.pd .mt{white-space:normal}
.pp2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pick a,.alt a{color:var(--text);font-weight:600;text-decoration:none}
.ps{font-variant-numeric:tabular-nums}
.alt{white-space:normal!important}
.w,.nm-l,.c small,.hd button.w{display:none}
#side{display:none}
/* ---- PC : tableau complet + fiche dans un panneau à droite ---- */
@media (min-width: 960px){
  .wrap{max-width:1280px;padding:24px 28px 40px}
  h1{font-size:22px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px}
  .top .sub{margin-bottom:0}
  .tools{display:flex;gap:10px;align-items:center}
  .tools input[type=search]{width:260px;margin:0}
  .tools .chips{margin:0;flex-wrap:nowrap}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
  .row,.hd{grid-template-columns:minmax(130px,1.2fr) 48px repeat(3,50px) 58px minmax(100px,1fr);gap:6px;padding:9px 12px}
  .hd{font-size:12px}
  .w,.hd button.w{display:block}
  .nm-s{display:none}.nm-l{display:inline}
  .hd button .nm-l{display:none}.hd button .nm-s{display:inline}
  .nm{font-size:14.5px}
  .row:hover{background:var(--bg)}
  .row[aria-expanded="true"]{background:var(--accent-bg)}
  .c{height:32px;flex-direction:column;font-size:13px;line-height:1.05}
  .c small{display:block;font-size:9.5px;opacity:.75;font-style:normal}
  .cell{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stt{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stt.q{color:var(--w-tx)}.stt.o{color:var(--r-tx)}.stt.l{color:var(--faint)}
  .st{display:none}
  .det{display:none!important}
  #side{display:block;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px 16px;font-size:13.5px}
  #side .mt{white-space:normal;overflow:visible}
  #side h2{font-size:17px;margin:12px 0 0}
  #side h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin:14px 0 4px;font-weight:600}
  .legend{max-width:900px}
  .split{grid-template-columns:340px minmax(0,1fr);align-items:start;gap:20px}
  .plist{max-height:calc(100vh - 220px)}
  .cards{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .pn{grid-template-columns:150px minmax(0,320px) minmax(0,1fr);align-items:center}
  .pd{grid-row:auto}
}
@media (min-width: 1200px){
  .hd button .nm-l{display:inline}.hd button .nm-s{display:none}
  .main{grid-template-columns:minmax(0,1fr) 400px;gap:22px}
  .row,.hd{grid-template-columns:minmax(160px,1.2fr) 66px repeat(3,74px) 84px minmax(160px,1fr);padding:9px 14px}
  .hd{font-size:11.5px;align-items:end}
  .hd button{white-space:normal;line-height:1.15}
}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = iso => { const d = new Date(iso + "T12:00:00"); return d.toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"}); };
const dm = iso => iso ? iso.slice(8,10) + "/" + iso.slice(5,7) : "";
const num = (v, d = 1) => Math.abs(v).toLocaleString("fr-FR", {minimumFractionDigits:d, maximumFractionDigits:d});
const sgn = (v, d = 1) => Math.abs(v) < 0.05 ? "0" : (v > 0 ? "+" : "−") + num(v, d);
const pts = v => sgn(v) + " pt" + (Math.abs(v) >= 2 ? "s" : "");
const cls = v => v >= 2 ? "g" : v <= -2 ? "r" : "n";
const SMALL = 3;   // moins de 3 matchs : chiffre affiché en pâle (trop peu de matchs pour s'y fier)
const POSTE = {G: "arrières", F: "ailiers", C: "pivots"};
const state = { sort: "score", lock: true, out: true, q: false, text: "", open: null };
const load = () => { try { Object.assign(state, JSON.parse(localStorage.getItem("ttfl-radar") || "{}"), {open:null, text:""}); } catch (e) {}
  if (!["score","Déf","B2B","Coé","plan"].includes(state.sort)) state.sort = "score"; };
const save = () => { try { localStorage.setItem("ttfl-radar", JSON.stringify({sort:state.sort, lock:state.lock, out:state.out, q:state.q})); } catch (e) {} };

function status(p) {
  if (p.locked_until) return {c:"l", t:"🔒", label:"Locké jusqu'au " + dm(p.locked_until)};
  if (p.injury === "Out" || p.injury === "Doubtful") return {c:"o", t:"✕", label:p.injury};
  if (p.injury === "Questionable") return {c:"q", t:"!", label:"Questionable"};
  if (p.injury === "Probable") return {c:"", t:"·", label:"Probable"};
  return {c:"", t:"", label:""};
}

// Case = points TTFL ajoutés (ou retirés) à la moyenne pour obtenir le score du soir
function critCell(c) {
  if (!c.shown) return `<div class="c x">·</div>`;
  const r = Math.round(c.delta * 10) / 10;
  return `<div class="c ${r >= 0.5 ? "g" : r <= -0.5 ? "r" : "n"}"><span>${Math.abs(r) < 0.05 ? "0" : sgn(r)}</span></div>`;
}
// Planning : ★ = pick suggéré ce soir ; sinon date du soir où le planning le place
function planCell(p) {
  if (p.picked) return `<div class="pl-c star" title="Ton pick de ce soir">✓</div>`;
  const pl = p.plan;
  if (!pl || !pl.planned) return `<div class="pl-c" title="Pas dans le planning des 30 prochains jours">–</div>`;
  if (pl.planned === D.date) return `<div class="pl-c star" title="Pick suggéré ce soir">★</div>`;
  return `<div class="pl-c" title="Le planning le garde pour le ${dm(pl.planned)}">${dm(pl.planned)}</div>`;
}
const WIDE = window.matchMedia("(min-width: 960px)");

function statusText(p) {
  if (p.picked) return {c:"", t:"Ton pick ce soir"};
  if (p.locked_until) return {c:"l", t:`Bloqué jusqu'au ${dm(p.locked_until)}`};
  if (p.injury && p.injury !== "Available") {
    const why = (p.injury_reason || "").replace("Injury/Illness - ", "");
    return {c: p.injury === "Out" || p.injury === "Doubtful" ? "o" : p.injury === "Questionable" ? "q" : "", t: p.injury + (why ? " · " + why : "")};
  }
  return {c:"", t: p.last_q ? `Incertain le ${dm(p.last_q)}` : ""};
}

const games = n => `${n} match${n > 1 ? "s" : ""}`;
const STATUS_FR = {Out: "Absent", Doubtful: "Incertain (doubtful)", Questionable: "Incertain (questionable)", Probable: "Probable"};

// Une ligne de fiche : intitulé, précision courte en gris, écart à droite (pâle si moins de 3 matchs)
// `value` (texte) remplace l'écart signé quand la ligne affiche une valeur et non un écart
function line(title, sub, delta, n, value) {
  const small = n != null && n < SMALL;
  const c = value != null || delta == null ? "" : delta >= 0.5 ? "pos" : delta <= -0.5 ? "neg" : "";
  return `<div class="ln${small ? " small" : ""}"><span>${title}<br><span class="mt">${sub}</span></span>` +
    `<b class="${c}">${value != null ? value : delta == null ? "–" : sgn(delta)}</b></div>`;
}

function detail(p) {
  const [def, b2b, coe] = p.crit;
  const out = [`<div class="mt" style="margin:8px 0 2px">Score du soir <b style="color:var(--text);font-size:15px">${num(p.score)} pts</b> · points TTFL attendus s'il joue : moyenne + ajustements ci-dessous</div>`];
  out.push(line("Moyenne de saison", p.base != null && Math.abs(p.base - p.avg) >= 0.1
    ? `${num(p.avg)} pts sur ${games(p.n)}, ramenée vers sa saison dernière en début de saison` : `sur ${games(p.n)}`, null, null, num(p.base)));
  out.push(line(`Défense de ${esc(p.opp)}`, p.def_n
    ? `les adversaires y font ${sgn(p.def_raw)} par rapport à leur moyenne (${p.def_n} matchs de joueurs), on en garde environ la moitié`
    : "pas encore assez de matchs", def.delta, null));
  if (p.b2b) out.push(line("Back-to-back", "2e soir d'affilée : −0,5 pt en moyenne dans la ligue", b2b.delta, null));
  if (p.mates.length) out.push(line("Coéquipiers absents", p.mates.map(m => m.n
      ? `sans ${esc(m.name)} : ${sgn(m.delta)} sur ${games(m.n)}` : `sans ${esc(m.name)} : jamais vu`).join(" · ") +
      " (effet réduit, peu de matchs)", coe.delta, null));
  // planning
  const pl = p.plan;
  if (p.picked) out.push(`<div class="verdict">✓ C'est ton pick de ce soir.</div>`);
  else if (pl) {
    const v = pl.planned === D.date ? `★ Pick suggéré ce soir par le planning.`
      : pl.planned ? `Le planning le garde pour le <b>${dm(pl.planned)}</b> (meilleur usage de son pick sur 30 jours).`
      : `Pas dans le planning des 30 prochains jours : d'autres joueurs rapportent plus chaque soir.`;
    const best = pl.best && pl.best !== D.date ? ` Son meilleur soir à venir : ${dm(pl.best)} (${num(pl.best_score)} pts attendus).` : "";
    out.push(`<div class="verdict">${v}${best}</div>`);
  }
  // pour info : impacts observés qui ne prédisent pas le prochain match
  const i = p.info;
  const fyi = [];
  if (i.form != null) fyi.push(`forme ${sgn(i.form)} (médiane des 5 derniers vs saison)`);
  if (i.venue_delta != null && i.n_venue) fyi.push(`${p.venue === "home" ? "à domicile" : "à l'extérieur"} ${sgn(i.venue_delta)} (${games(i.n_venue)})`);
  if (p.b2b && i.n_b2b) fyi.push(`en back-to-back ${sgn(i.b2b_delta)} (${games(i.n_b2b)})`);
  if (fyi.length) out.push(`<div class="fyi">Pour info, sans valeur prédictive (testé sur la saison) : ${fyi.join(" · ")}.</div>`);
  const tags = [];
  if (p.injury && p.injury !== "Available") tags.push(`<span class="tag ${p.injury === "Out" || p.injury === "Doubtful" ? "tr" : "tw"}">${esc(STATUS_FR[p.injury] || p.injury)}${p.injury_reason ? " · " + esc(p.injury_reason.replace("Injury/Illness - ", "")) : ""}</span>`);
  if (p.last_q) tags.push(`<span class="tag tn">Incertain le ${dm(p.last_q)}</span>`);
  if (p.last_out) tags.push(`<span class="tag tn">Absent (blessure) le ${dm(p.last_out)}</span>`);
  if (p.locked_until) tags.push(`<span class="tag tn">Bloqué jusqu'au ${dm(p.locked_until)}</span>`);
  if (tags.length) out.push(`<div style="margin-top:10px">${tags.join("")}</div>`);
  out.push(`<a class="more" href="#joueur-${p.id}">Voir tout son historique et ses graphiques →</a>`);
  return out.join("");
}

function render() {
  const t = state.text.trim().toLowerCase();
  let ps = D.players.filter(p => {
    const s = status(p);
    if (state.lock && p.locked_until) return false;
    if (state.out && s.c === "o") return false;
    if (state.q && s.c === "q") return false;
    if (t && !(p.name.toLowerCase().includes(t) || p.team.toLowerCase() === t || p.opp.toLowerCase() === t)) return false;
    return true;
  });
  const key = state.sort;
  const val = (p, k) => {
    if (k === "score") return p.score;
    if (k === "plan") return p.plan && p.plan.planned ? -Date.parse(p.plan.planned) : -Infinity;
    const c = p.crit.find(c => c.k === k); return c.shown ? c.delta : -Infinity; };
  ps.sort((a, b) => val(b, key) - val(a, key));
  const head = `<div class="hd"><div>Joueur</div>` +
    [["score","Score","Score du soir"],["Déf","Déf","Défense adverse"],["B2B","B2B","Back-to-back"],["Coé","Coé","Coéquipiers"],["plan","Plan","Planning"]].map(([k, l, L]) =>
      `<button data-sort="${k}" ${state.sort === k ? 'aria-sort="descending"' : ""} style="${k === "score" ? "text-align:right" : ""}" title="${L}"><span class="nm-s">${l}</span><span class="nm-l">${L}</span></button>`).join("") + `<div class="w">Statut</div><div></div></div>`;
  const rows = ps.map(p => {
    const s = status(p);
    const sep = p.venue === "home" ? "vs" : p.venue === "away" ? "@" : "n.";
    const open = state.open === p.id;
    return `<div class="row ${s.c === "o" || s.c === "l" ? "dim" : ""}" data-id="${p.id}" role="button" aria-expanded="${open}">
      <div><div class="nm" title="${esc(p.name)}"><span class="nm-s">${esc(p.short)}</span><span class="nm-l">${esc(p.name)}</span></div><div class="mt">${esc(p.team)} ${sep} ${esc(p.opp)} · ${esc(p.tip || "")}</div></div>
      <div class="pj">${Math.round(p.score)}<div class="av">moy ${Math.round(p.avg)}</div></div>${p.crit.map(critCell).join("")}
${planCell(p)}
      <div class="w stt ${statusText(p).c}" title="${esc(statusText(p).t)}">${esc(statusText(p).t)}</div>
      <div class="st ${s.c}" title="${esc(s.label)}" aria-label="${esc(s.label)}">${s.t}</div></div>
      <div class="det ${open && !WIDE.matches ? "open" : ""}">${open && !WIDE.matches ? detail(p) : ""}</div>`;
  }).join("");
  $("#list").innerHTML = head + (rows || `<div class="empty">Aucun joueur avec ces filtres.</div>`);
  // PC : fiche dans le panneau de droite (par défaut le premier joueur de la liste)
  if (WIDE.matches) {
    const sel = ps.find(p => p.id === state.open) || ps[0];
    $("#side").innerHTML = sel
      ? `<h2>${esc(sel.name)}</h2><div class="mt">${esc(sel.team)} ${sel.venue === "home" ? "vs" : sel.venue === "away" ? "@" : "n."} ${esc(sel.opp)} · ${esc(sel.tip || "")}</div>${detail(sel)}`
      : `<div class="empty">Aucun joueur avec ces filtres.</div>`;
    if (sel) { const r = document.querySelector(`.row[data-id="${sel.id}"]`); if (r) r.setAttribute("aria-expanded", "true"); }
  }
}

function init() {
  load();
  if (!D || !D.players.length) {
    $("#sub").textContent = "Pas de match ce soir.";
    $("#list").innerHTML = `<div class="empty">Rien à picker ce soir.</div>`;
    return;
  }
  $("#title").textContent = "Ce soir · " + fmtDate(D.date);
  $("#sub").textContent = `${D.games} matchs · 1er match ${D.first_tip || "?"} · blessures ${D.injury_report ? D.injury_report.slice(11) + " (" + dm(D.injury_report.slice(0,10)) + ")" : "?"} · page générée ${D.generated.slice(11)}`;
  $("#legend").innerHTML = `<b>Score</b> = points TTFL attendus ce soir s'il joue : moyenne de saison + défense adverse + back-to-back + coéquipiers absents. Les cases <b>Déf</b>, <b>B2B</b> et <b>Coé</b> donnent ces ajustements en points. <b>Plan</b> : ★ = pick suggéré ce soir par le planning sur 30 jours, sinon la date où il le garde. La forme récente et le domicile/extérieur propres au joueur ne prédisent rien (testé) : ils sont seulement dans la fiche, pour info.`;
  for (const [id, k] of [["#f-lock","lock"],["#f-out","out"],["#f-q","q"]]) {
    const b = $(id); b.setAttribute("aria-pressed", state[k]);
    b.onclick = () => { state[k] = !state[k]; b.setAttribute("aria-pressed", state[k]); save(); render(); };
  }
  $("#q").oninput = e => { state.text = e.target.value; render(); };
  $("#list").onclick = e => {
    const sb = e.target.closest("[data-sort]");
    if (sb) { state.sort = sb.dataset.sort; save(); render(); return; }
    const row = e.target.closest(".row");
    if (row) { const id = Number(row.dataset.id); state.open = (state.open === id && !WIDE.matches) ? null : id; render(); }
  };
  WIDE.addEventListener("change", render);
  render();
}
init();
</script>
<script>
// ---- Analyses : vues Joueurs, Équipes, Tendances (graphiques SVG faits main, sans dépendance) ----
(() => {
const H = D.hist || {players: [], teams: {}};
const byId = new Map(H.players.map(p => [p.id, p]));
const view = id => document.getElementById(id);
const fmt1 = v => v.toLocaleString("fr-FR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + fmt1(Math.abs(v));
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const ddmm = iso => iso.slice(8, 10) + "/" + iso.slice(5, 7);
const nMatch = n => `${n} match${n > 1 ? "s" : ""}`;
const POS = {G: "Arrière", F: "Ailier", C: "Pivot"};
const POSP = {G: "Arrières", F: "Ailiers", C: "Pivots"};
const tone = d => d >= 2 ? "g" : d <= -2 ? "r" : "n";
// largeur de dessin = largeur réelle à l'écran, pour garder des textes lisibles sur téléphone
const CW = () => window.innerWidth < 600 ? Math.max(300, window.innerWidth - 64) : 640;

const median = a => { if (!a.length) return NaN; const t = [...a].sort((x, y) => x - y), m = t.length >> 1;
  return t.length % 2 ? t[m] : (t[m - 1] + t[m]) / 2; };

// Statistiques d'un joueur à partir de ses matchs : [date, adv, lieu h/a/n, b2b, ttfl, min, statut]
// Forme = médiane des 5 derniers - médiane de saison (un match exceptionnel ne fausse pas la tendance)
function stats(p) {
  const s = p.g.map(g => g[4]);
  const last5 = s.slice(-5);
  return {avg: mean(s), med: median(s), n: s.length, sd: sd(s), best: Math.max(...s), worst: Math.min(...s),
    under20: s.filter(x => x < 20).length / s.length, over50: s.filter(x => x >= 50).length / s.length,
    form: median(last5) - median(s), last5med: median(last5), last10: s.slice(-10)};
}

// ---------- graphiques ----------
function sparkline(vals, w = 70, h = 22) {
  if (vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), k = hi === lo ? 1 : hi - lo;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 2 - (v - lo) / k * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" style="fill:none;stroke:var(--accent);stroke-width:1.6"/></svg>`;
}

// Mise en évidence d'une partie des matchs : "home", "away", "b2b", "opp:NOP", "bin:20:30"
function highlight(key) {
  if (!key) return null;
  const [k, a, b] = key.split(":");
  if (k === "home") return {label: "À domicile", f: g => g[2] === "h"};
  if (k === "away") return {label: "À l'extérieur", f: g => g[2] === "a"};
  if (k === "b2b") return {label: "Back-to-back", f: g => g[3]};
  if (k === "opp") return {label: `Face à ${a}`, f: g => g[1] === a};
  if (k === "bin") return {label: `Entre ${a} et ${Number(b) - 1} pts`, f: g => g[4] >= Number(a) && g[4] < Number(b)};
  return null;
}

// Géométrie partagée par la courbe et son infobulle
function scoreGeom(p) {
  const W = CW(), Hh = W < 500 ? 190 : 220, L = 30, R = 8, T = 12, B = 26;
  const s = p.g.map(g => g[4]);
  const hi = Math.max(80, Math.ceil(Math.max(...s) / 10) * 10), lo = Math.min(0, Math.floor(Math.min(...s) / 10) * 10);
  return {W, Hh, L, R, T, B, s,
    x: i => L + (s.length === 1 ? (W - L - R) / 2 : i / (s.length - 1) * (W - L - R)),
    y: v => T + (hi - v) / (hi - lo) * (Hh - T - B), hi, lo};
}
function rolling(s, o) {
  const agg = o.line === "avg" ? mean : median;
  return s.map((_, i) => i < 2 ? null : agg(s.slice(Math.max(0, i - o.win + 1), i + 1)));
}

// Courbe des scores match par match + médiane (ou moyenne) glissante + moyenne de saison
function scoreChart(p, o) {
  const G = scoreGeom(p), {W, Hh, L, R, s, x, y} = G;
  const hl = highlight(o.hl), avg = mean(s);
  let out = `<svg viewBox="0 0 ${W} ${Hh}" class="chart" role="img" aria-label="Scores TTFL match par match">`;
  for (let v = G.lo; v <= G.hi; v += 20) out += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`;
  out += `<line x1="${L}" x2="${W - R}" y1="${y(avg)}" y2="${y(avg)}" class="avgline"/><text x="${W - R}" y="${y(avg) - 5}" class="ax" text-anchor="end">moyenne ${fmt1(avg)}</text>`;
  if (hl) {
    const sub = p.g.filter(hl.f).map(g => g[4]);
    if (sub.length) out += `<line x1="${L}" x2="${W - R}" y1="${y(mean(sub))}" y2="${y(mean(sub))}" class="hlline"/><text x="${L + 4}" y="${y(mean(sub)) - 5}" class="ax hlt">${hl.label} : ${fmt1(mean(sub))} (${nMatch(sub.length)})</text>`;
  }
  const roll = rolling(s, o);
  out += `<polyline class="roll${hl ? " dim" : ""}" points="${roll.map((v, i) => v == null ? "" : `${x(i)},${y(v)}`).join(" ")}"/>`;
  const step = Math.max(1, Math.ceil(s.length / Math.max(3, Math.floor((W - L - R) / 56))));  // ~56 px par date
  p.g.forEach((g, i) => {
    const on = hl ? (hl.f(g) ? " on" : " off") : "";
    const cls = (g[4] < 20 ? "dot lo" : g[4] >= 50 ? "dot hi" : "dot") + (g[3] ? " b2b" : "") + on;
    out += `<circle cx="${x(i)}" cy="${y(g[4])}" r="${g[3] ? 4.5 : 4}" class="${cls}" data-i="${i}"/>`;
    if (g[6] === "Q" || g[6] === "D") out += `<text x="${x(i)}" y="${y(g[4]) - 8}" class="flag" text-anchor="middle">!</text>`;
    const last = i === s.length - 1;
    if ((i % step === 0 && s.length - 1 - i >= step) || last)
      out += `<text x="${x(i)}" y="${Hh - 8}" class="ax" text-anchor="${i === 0 ? "start" : last ? "end" : "middle"}">${ddmm(g[0])}</text>`;
  });
  out += `<line class="cursor" x1="0" x2="0" y1="${G.T}" y2="${Hh - G.B}" style="display:none"/></svg>`;
  const lname = `${o.line === "avg" ? "moyenne" : "médiane"} des ${o.win} derniers`;
  return out + `<div class="leg"><span class="k dotk"></span>score du match <span class="k rollk"></span>${lname} <span class="k avgk"></span>moyenne de saison <span class="flag">!</span> annoncé incertain · point creux = back-to-back</div>`;
}

// Répartition des scores par tranches de 10 points (cliquer une barre met ces matchs en évidence)
function histogram(p) {
  const s = p.g.map(g => g[4]);
  const bins = [[-99, 10, "<10"], [10, 20, "10-19"], [20, 30, "20-29"], [30, 40, "30-39"], [40, 50, "40-49"], [50, 60, "50-59"], [60, 999, "60+"]];
  const counts = bins.map(([a, b]) => s.filter(v => v >= a && v < b).length);
  const mx = Math.max(...counts, 1), W = CW(), Hh = 150, B = 24, bw = (W - 20) / bins.length;
  let o = `<svg viewBox="0 0 ${W} ${Hh}" class="chart" role="img" aria-label="Répartition des scores">`;
  bins.forEach(([a, b, lab], i) => {
    const h = counts[i] / mx * (Hh - B - 18), x0 = 10 + i * bw;
    o += `<rect x="${x0 + 2}" y="${10}" width="${bw - 4}" height="${Hh - B - 10}" class="hit" data-hl="bin:${Math.max(a, 0)}:${b}"><title>${lab} pts : ${nMatch(counts[i])} · cliquer pour les voir sur la courbe</title></rect>`;
    o += `<rect x="${x0 + 6}" y="${Hh - B - h}" width="${bw - 12}" height="${h}" rx="4" class="bar ${a < 20 ? "lo" : a >= 50 ? "hi" : ""}" pointer-events="none"/>`;
    if (counts[i]) o += `<text x="${x0 + bw / 2}" y="${Hh - B - h - 5}" class="ax" text-anchor="middle" pointer-events="none">${counts[i]}</text>`;
    o += `<text x="${x0 + bw / 2}" y="${Hh - 8}" class="ax" text-anchor="middle" pointer-events="none">${lab}</text>`;
  });
  return o + `</svg>`;
}

// Barres d'écart à la moyenne (vert au-dessus, rouge en dessous) ; `key` = mise en évidence au clic
function deltaBars(items) {
  const mx = Math.max(4, ...items.map(i => Math.abs(i.d)));
  return `<div class="dbars">` + items.map(i => {
    const w = Math.abs(i.d) / mx * 50, r = Math.round(i.d * 10) / 10;
    return `<div class="dbar${i.n < 3 ? " small" : ""}${i.key ? " clk" : ""}" ${i.key ? `data-hl="${i.key}" role="button" tabindex="0"` : ""}><span class="lab">${i.label}<span class="mt"> · ${nMatch(i.n)}</span></span>
      <span class="track"><span class="fill ${i.d >= 0 ? "g" : "r"}" style="${i.d >= 0 ? "left:50%" : `left:${50 - w}%`};width:${w}%"></span><span class="zero"></span></span>
      <b class="${r >= 2 ? "pos" : r <= -2 ? "neg" : ""}">${signed(i.d)}</b></div>`;
  }).join("") + `</div>`;
}

// Frise des matchs de l'équipe : joué / annoncé incertain / absent
function timeline(p) {
  const ev = [...p.g.map(g => ({d: g[0], opp: g[1], t: g[6] === "Q" || g[6] === "D" ? "q" : "p", txt: `${g[4]} pts`})),
              ...p.abs.map(a => ({d: a[0], opp: a[1], t: "o", txt: a[2]}))].sort((a, b) => a.d < b.d ? -1 : 1);
  const reasons = {};
  p.abs.forEach(a => reasons[a[2]] = (reasons[a[2]] || 0) + 1);
  const q = p.g.filter(g => g[6] === "Q" || g[6] === "D").length;
  const summary = p.abs.length
    ? `Absent ${p.abs.length} fois (${Object.entries(reasons).map(([k, v]) => `${k.toLowerCase()} ${v}`).join(", ")})`
    : "Aucune absence cette saison";
  return `<div class="tl">${ev.map(e => `<span class="tli ${e.t}" title="${ddmm(e.d)} · ${e.opp} · ${e.txt}"></span>`).join("")}</div>
    <div class="leg"><span class="k tlp"></span>a joué <span class="k tlq"></span>a joué, annoncé incertain <span class="k tlo"></span>absent</div>
    <div class="mt" style="margin-top:4px">${summary}${q ? ` · annoncé incertain ${q} fois avant un match qu'il a joué` : ""}</div>`;
}

// ---------- vue Joueurs ----------
const chartState = {line: "med", win: 5, hl: null};

function playerSheet(p) {
  const st = stats(p);
  const g = p.g;
  const split = (f) => { const v = g.filter(f).map(x => x[4]); return {d: mean(v) - st.avg, n: v.length}; };
  const rows = [
    {label: "À domicile", key: "home", ...split(x => x[2] === "h")},
    {label: "À l'extérieur", key: "away", ...split(x => x[2] === "a")},
    {label: "Back-to-back", key: "b2b", ...split(x => x[3])},
  ].filter(r => r.n > 0);
  const opps = {};
  g.forEach(x => (opps[x[1]] = opps[x[1]] || []).push(x[4]));
  const vsOpp = Object.entries(opps).map(([o, v]) => ({label: `Face à ${o}`, key: `opp:${o}`, d: mean(v) - st.avg, n: v.length}))
    .sort((a, b) => b.d - a.d);
  const tile = (k, v, sub) => `<div class="tile"><div class="mt">${k}</div><div class="tv">${v}</div>${sub ? `<div class="mt">${sub}</div>` : ""}</div>`;
  return `<h2>${esc(p.name)}</h2><div class="mt">${esc(p.team)} · ${POS[p.bucket] || ""}</div>
    <div class="tiles">${tile("Moyenne", fmt1(st.avg), `médiane ${fmt1(st.med)}`)}${tile("Forme", signed(st.form), `médiane 5 derniers ${fmt1(st.last5med)}`)}${tile("Matchs", st.n)}
      ${tile("Meilleur", st.best)}${tile("Pire", st.worst)}${tile("Sous 20 pts", Math.round(st.under20 * 100) + " %")}${tile("50 pts ou plus", Math.round(st.over50 * 100) + " %")}${tile("Régularité", "± " + fmt1(st.sd))}</div>
    <h3>Score TTFL match par match</h3>
    <div class="ctrl" id="ctrl"></div>
    <div class="chartwrap"><div id="sc"></div><div class="tip" id="tip" hidden></div></div>
    <h3>Répartition de ses scores</h3><div class="mt hint">Touche une barre pour voir ces matchs sur la courbe.</div>${histogram(p)}
    <h3>Écart à sa moyenne selon la situation</h3><div class="mt hint">Touche une ligne pour voir ces matchs sur la courbe.</div>${deltaBars(rows)}
    <h3>Face à chaque adversaire</h3>${deltaBars(vsOpp)}
    <h3>Présence et absences</h3>${timeline(p)}`;
}

function wirePlayer(p) {
  const sheet = view("psheet");
  const chip = (k, v, label) => `<button class="chip sm" data-${k}="${v}" aria-pressed="${String(chartState[k]) === String(v)}">${label}</button>`;
  const draw = () => {
    const hl = highlight(chartState.hl);
    view("ctrl").innerHTML = `<span class="mt">Courbe</span>${chip("line", "med", "Médiane")}${chip("line", "avg", "Moyenne")}
      <span class="mt">sur</span>${chip("win", 5, "5 matchs")}${chip("win", 10, "10 matchs")}
      ${hl ? `<button class="chip sm on" data-clear="1">${hl.label} ✕</button>` : ""}`;
    view("sc").innerHTML = scoreChart(p, chartState);
    view("tip").hidden = true;
    const svg = view("sc").querySelector("svg"), G = scoreGeom(p), roll = rolling(G.s, chartState);
    const show = e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * G.W;
      const i = Math.max(0, Math.min(G.s.length - 1, Math.round((px - G.L) / (G.W - G.L - G.R) * (G.s.length - 1))));
      const g = p.g[i], cur = svg.querySelector(".cursor"), tip = view("tip");
      cur.setAttribute("x1", G.x(i)); cur.setAttribute("x2", G.x(i)); cur.style.display = "";
      svg.querySelectorAll(".dot.cur").forEach(c => c.classList.remove("cur"));
      svg.querySelector(`.dot[data-i="${i}"]`)?.classList.add("cur");
      const where = g[2] === "h" ? "vs" : g[2] === "a" ? "@" : "n.";
      const st = {Q: "annoncé incertain", D: "annoncé très incertain", P: "annoncé probable"}[g[6]];
      tip.innerHTML = `<b>${ddmm(g[0])} ${where} ${g[1]}</b><br><span class="big">${g[4]} pts</span> · ${g[5]} min` +
        `${g[3] ? "<br>back-to-back" : ""}${st ? "<br>" + st : ""}` +
        `${roll[i] != null ? `<br><span class="mt">${chartState.line === "avg" ? "moyenne" : "médiane"} des ${chartState.win} derniers : ${fmt1(roll[i])}</span>` : ""}`;
      tip.hidden = false;
      const left = G.x(i) / G.W * r.width, top = G.y(g[4]) / G.Hh * r.height;
      tip.style.left = Math.min(Math.max(left, 70), r.width - 70) + "px";
      tip.style.top = Math.max(top - 12, 0) + "px";
    };
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { view("tip").hidden = true; svg.querySelector(".cursor").style.display = "none"; } });
  };
  sheet.onclick = e => {
    const t = e.target.closest("[data-line],[data-win],[data-clear],[data-hl]");
    if (!t) return;
    if (t.dataset.line) chartState.line = t.dataset.line;
    else if (t.dataset.win) chartState.win = Number(t.dataset.win);
    else if (t.dataset.clear) chartState.hl = null;
    else { chartState.hl = chartState.hl === t.dataset.hl ? null : t.dataset.hl; view("sc").scrollIntoView({block: "center", behavior: "smooth"}); }
    draw();
  };
  sheet.onkeydown = e => { if (e.key === "Enter" && e.target.dataset.hl) e.target.click(); };
  draw();
}

function renderPlayers(selId) {
  const el = view("v-joueurs");
  if (!el.dataset.built) {
    el.innerHTML = `<div class="split"><div class="pick"><input type="search" id="pq" placeholder="Chercher un joueur ou une équipe" aria-label="Chercher un joueur"><div id="plist" class="plist"></div></div><div id="psheet" class="sheet"></div></div>`;
    el.dataset.built = "1";
    view("pq").oninput = () => fillList();
  }
  fillList(selId);
  const p = byId.get(selId) || H.players[0];
  chartState.hl = null;
  view("psheet").innerHTML = p ? playerSheet(p) : `<div class="empty">Pas encore de données.</div>`;
  if (p) wirePlayer(p);
  if (selId) view("psheet").scrollIntoView({block: "start"});
}
function fillList(selId) {
  const t = (view("pq")?.value || "").trim().toLowerCase();
  const ps = H.players.filter(p => !t || p.name.toLowerCase().includes(t) || p.team.toLowerCase() === t).slice(0, 60);
  view("plist").innerHTML = ps.map(p => { const s = stats(p);
    return `<a class="pl${p.id === selId ? " on" : ""}" href="#joueur-${p.id}"><span><b>${esc(p.name)}</b><br><span class="mt">${p.team} · moy ${fmt1(s.avg)}</span></span>${sparkline(s.last10)}</a>`; }).join("")
    || `<div class="empty">Aucun joueur.</div>`;
}

// ---------- vue Équipes ----------
function renderTeams(sel) {
  const el = view("v-equipes");
  const teams = Object.keys(H.teams).sort();
  const sum = t => ["G", "F", "C"].reduce((s, b) => s + (H.teams[t].s[b]?.[0] || 0), 0);
  const order = [...teams].sort((a, b) => sum(b) - sum(a));
  const cell = (t, b) => { const v = H.teams[t].s[b]; if (!v) return `<td>·</td>`;
    return `<td><span class="c ${tone(v[0])}${v[1] < 15 ? " sm" : ""}" title="${nMatch(v[1])} de joueurs">${signed(v[0])}</span></td>`; };
  sel = sel && H.teams[sel] ? sel : order[0];
  el.innerHTML = `<p class="mt intro">Ce que chaque défense concède : écart moyen des joueurs adverses (15 min ou plus) à leur propre moyenne TTFL, par poste. Vert = défense qui fait marquer, rouge = défense qui étouffe. Clique sur une équipe pour voir son évolution.</p>
    <div class="split"><div class="pick"><table class="heat"><thead><tr><th>Équipe</th><th>Arrières</th><th>Ailiers</th><th>Pivots</th></tr></thead><tbody>
    ${order.map(t => `<tr class="${t === sel ? "on" : ""}" data-team="${t}"><td><a href="#equipe-${t}">${t}</a></td>${cell(t, "G")}${cell(t, "F")}${cell(t, "C")}</tr>`).join("")}
    </tbody></table></div><div class="sheet">${teamSheet(sel)}</div></div>`;
  el.querySelector("tbody").onclick = e => { const tr = e.target.closest("tr"); if (tr) location.hash = "#equipe-" + tr.dataset.team; };
  wireTeam(sel);
}
const teamHidden = new Set();
function teamChart(t) {
  const w = H.teams[t].w;
  const weeks = [...new Set(Object.values(w).flat().map(x => x[0]))].sort();
  const W = CW(), Hh = W < 500 ? 190 : 220, L = 30, R = 8, T = 12, B = 26;
  const all = Object.values(w).flat().map(x => x[1]);
  const hi = Math.max(6, Math.ceil(Math.max(...all) / 2) * 2), lo = Math.min(-6, Math.floor(Math.min(...all) / 2) * 2);
  const x = i => L + (weeks.length === 1 ? (W - L - R) / 2 : i / (weeks.length - 1) * (W - L - R));
  const y = v => T + (hi - v) / (hi - lo) * (Hh - T - B);
  let o = `<svg viewBox="0 0 ${W} ${Hh}" class="chart" role="img" aria-label="Évolution par semaine">`;
  for (let v = lo; v <= hi; v += 2) o += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${v === 0 ? "avgline" : "grid"}"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v > 0 ? "+" : ""}${v}</text>`;
  ["G", "F", "C"].filter(b => !teamHidden.has(b)).forEach(b => {
    const pts = (w[b] || []).map(r => [weeks.indexOf(r[0]), r[1], r[2]]);
    o += `<polyline class="tline ${b}" points="${pts.map(([i, v]) => `${x(i)},${y(v)}`).join(" ")}"/>`;
    pts.forEach(([i, v, n]) => o += `<circle cx="${x(i)}" cy="${y(v)}" r="${n < 5 ? 2.5 : 3.5}" class="tdot ${b}${n < 5 ? " few" : ""}"/>`);
  });
  weeks.forEach((wk, i) => o += `<text x="${x(i)}" y="${Hh - 8}" class="ax" text-anchor="${i === 0 ? "start" : i === weeks.length - 1 ? "end" : "middle"}">${ddmm(wk)}</text>`);
  o += `<line class="cursor" x1="0" x2="0" y1="${T}" y2="${Hh - B}" style="display:none"/></svg>`;
  const leg = ["G", "F", "C"].map(b => `<button class="legb${teamHidden.has(b) ? " off" : ""}" data-pos="${b}"><span class="k t${b}"></span>${POSP[b].toLowerCase()}</button>`).join("");
  return {html: o + `<div class="leg">${leg} · touche un poste pour l'afficher ou le masquer · petit point = moins de 5 matchs de joueurs</div>`,
    geo: {W, Hh, L, R, x, weeks, w}};
}
function teamSheet(t) {
  const s = H.teams[t].s;
  const line = b => s[b] ? `<div class="ln"><span>${POSP[b]}<br><span class="mt">${nMatch(s[b][1])} de joueurs</span></span><b class="${s[b][0] >= 2 ? "pos" : s[b][0] <= -2 ? "neg" : ""}">${signed(s[b][0])}</b></div>` : "";
  return `<h2>${t}</h2><div class="mt">Écart concédé sur la saison</div>${["G", "F", "C"].map(line).join("")}<h3>Évolution semaine par semaine</h3>
    <div class="chartwrap"><div id="tc"></div><div class="tip" id="ttip" hidden></div></div>`;
}
function wireTeam(t) {
  const draw = () => {
    const {html, geo} = teamChart(t);
    view("tc").innerHTML = html;
    view("ttip").hidden = true;
    const svg = view("tc").querySelector("svg");
    const show = e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * geo.W, n = geo.weeks.length;
      const i = Math.max(0, Math.min(n - 1, Math.round((px - geo.L) / (geo.W - geo.L - geo.R) * (n - 1))));
      const wk = geo.weeks[i], cur = svg.querySelector(".cursor"), tip = view("ttip");
      cur.setAttribute("x1", geo.x(i)); cur.setAttribute("x2", geo.x(i)); cur.style.display = "";
      const rows = ["G", "F", "C"].filter(b => !teamHidden.has(b)).map(b => {
        const v = (geo.w[b] || []).find(z => z[0] === wk);
        return v ? `<span class="k t${b}"></span>${POSP[b]} : <b>${signed(v[1])}</b> <span class="mt">(${nMatch(v[2])})</span>` : "";
      }).filter(Boolean);
      tip.innerHTML = `<b>Semaine du ${ddmm(wk)}</b><br>${rows.join("<br>") || "pas de match"}`;
      tip.hidden = false;
      const left = geo.x(i) / geo.W * r.width;
      tip.style.left = Math.min(Math.max(left, 90), r.width - 90) + "px";
      tip.style.top = "8px";
    };
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { view("ttip").hidden = true; svg.querySelector(".cursor").style.display = "none"; } });
  };
  view("tc").onclick = e => { const b = e.target.closest("[data-pos]"); if (!b) return;
    teamHidden.has(b.dataset.pos) ? teamHidden.delete(b.dataset.pos) : teamHidden.add(b.dataset.pos); draw(); };
  draw();
}

// ---------- vue Tendances ----------
function renderTrends() {
  const el = view("v-tendances");
  const ps = H.players.map(p => ({p, s: stats(p)}));
  const recent = (() => { const last = H.players.flatMap(p => p.g.map(g => g[0])).sort().pop();
    if (!last) return []; const lim = new Date(last); lim.setDate(lim.getDate() - 6); const l = lim.toISOString().slice(0, 10);
    return H.players.flatMap(p => p.g.filter(g => g[0] >= l).map(g => ({p, g}))).sort((a, b) => b.g[4] - a.g[4]).slice(0, 10); })();
  const row = (p, val, sub, s) => `<a class="pl" href="#joueur-${p.id}"><span><b>${esc(p.name)}</b><br><span class="mt">${p.team} · ${sub}</span></span><span class="tv2">${val}</span>${s ? sparkline(s.last10) : ""}</a>`;
  const card = (title, sub, list) => `<div class="card"><h3>${title}</h3><div class="mt">${sub}</div>${list.join("") || `<div class="empty">Rien pour l'instant.</div>`}</div>`;
  const big = ps.filter(x => x.s.avg >= 25 && x.s.n >= 8);
  const reg = ps.filter(x => x.s.avg >= 30 && x.s.n >= 8);
  el.innerHTML = `<div class="cards">
    ${card("En forme", "Médiane des 5 derniers matchs comparée à celle de la saison (moyenne 25+)", [...big].sort((a, b) => b.s.form - a.s.form).slice(0, 10).map(x => row(x.p, signed(x.s.form), `moy ${fmt1(x.s.avg)}`, x.s)))}
    ${card("En baisse", "Médiane des 5 derniers matchs comparée à celle de la saison (moyenne 25+)", [...big].sort((a, b) => a.s.form - b.s.form).slice(0, 10).map(x => row(x.p, signed(x.s.form), `moy ${fmt1(x.s.avg)}`, x.s)))}
    ${card("Les plus réguliers", "Plus petit écart-type (moyenne 30+) : le moins de mauvaises surprises", [...reg].sort((a, b) => a.s.sd - b.s.sd).slice(0, 10).map(x => row(x.p, "± " + fmt1(x.s.sd), `moy ${fmt1(x.s.avg)}`, x.s)))}
    ${card("Risque de carotte", "Part des matchs sous 20 pts (moyenne 30+)", [...reg].sort((a, b) => b.s.under20 - a.s.under20).slice(0, 10).map(x => row(x.p, Math.round(x.s.under20 * 100) + " %", `moy ${fmt1(x.s.avg)}`, x.s)))}
    ${card("Meilleurs scores de la semaine", "7 derniers jours", recent.map(({p, g}) => row(p, g[4] + " pts", `${ddmm(g[0])} ${g[2] === "h" ? "vs" : "@"} ${g[1]}`)))}
  </div>`;
}

// ---------- vue Planning ----------
function renderPlanning() {
  const el = view("v-planning");
  const nights = D.plan || [];
  const wd = iso => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", {weekday: "short", day: "numeric", month: "short"});
  const who = x => `<a href="#joueur-${x.id}">${esc(x.name)}</a> <span class="mt">${x.team} vs ${x.opp}</span>`;
  el.innerHTML = `<p class="mt intro">Pour chaque soir des 30 prochains jours, le pick qui maximise le total de points sur la période :
    chaque joueur une seule fois (lock de 30 jours), tes locks respectés. Recalculé à chaque relevé.
    ${D.plan_total ? `Total attendu sur la période : <b>${fmt1(D.plan_total)} pts</b>.` : ""}
    Les matchs de la NBA Cup dont les équipes ne sont pas encore connues n'apparaissent pas.</p>
    <div class="planlist">${nights.map(n => `<div class="pn${n.date === D.date ? " on" : ""}">
      <div class="pd"><b>${wd(n.date)}</b><span class="mt">${nMatch(n.games)}${n.games <= 4 ? " · petite soirée" : n.games >= 12 ? " · grosse soirée" : ""}</span></div>
      <div class="pp2">${n.pick ? `<span class="pick">${n.mine ? "✓ ton pick :" : "★"} ${who(n.pick)}</span><b class="ps">${fmt1(n.pick.score)}</b>` : `<span class="mt">aucun pick dispo</span>`}</div>
      <div class="alt mt">autres : ${n.top.filter(x => !n.pick || x.id !== n.pick.id).slice(0, 3).map(x => `${esc(x.name)} ${fmt1(x.score)}${D.plan.some(m => m.pick && m.pick.id === x.id) ? " (gardé)" : ""}`).join(" · ")}</div>
    </div>`).join("") || `<div class="empty">Pas de planning disponible.</div>`}</div>`;
}

// ---------- navigation ----------
function route() {
  const h = location.hash || "#soir";
  const name = h.startsWith("#joueur") ? "joueurs" : h.startsWith("#equipe") ? "equipes" : h.slice(1);
  const v = ["soir", "planning", "joueurs", "equipes", "tendances"].includes(name) ? name : "soir";
  for (const s of ["soir", "planning", "joueurs", "equipes", "tendances"]) view("v-" + s).hidden = s !== v;
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + v ? "page" : "false"));
  document.querySelector(".tools").style.display = v === "soir" ? "" : "none";
  const title = document.getElementById("title");
  title.dataset.soir = title.dataset.soir || title.textContent;
  title.textContent = {soir: title.dataset.soir, planning: "Planning", joueurs: "Joueurs", equipes: "Équipes", tendances: "Tendances"}[v];
  if (v === "joueurs") renderPlayers(h.startsWith("#joueur-") ? Number(h.slice(8)) : null);
  if (v === "equipes") renderTeams(h.startsWith("#equipe-") ? h.slice(8) : null);
  if (v === "tendances") renderTrends();
  if (v === "planning") renderPlanning();
}
window.addEventListener("hashchange", route);
route();
})();

</script>
</body>
</html>
